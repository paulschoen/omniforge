name: 'Warhammer RSS Updater'

on:
  schedule:
    - cron: '0 */3 * * *'
    - cron: '0 10-17 * * *'
  workflow_dispatch:

jobs:
  update-rss:
    runs-on: ubuntu-latest
    steps:
      - name: '🔽 Checkout Repository'
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: '⚙️ Set up Node.js'
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: '📦 Cache npm dependencies'
        uses: actions/cache@v3
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: '📦 Install Dependencies'
        run: npm ci

      - name: '⚙️ Build Project'
        run: npm run build:mechanicus-scrivener

      - name: '🛠 Run RSS Generation for All Feeds'
        env:
          MACHINE_SPIRIT_API_KEY: ${{ secrets.MACHINE_SPIRIT_API_KEY }}
          SYSTEM_PROMPT: ${{ secrets.SYSTEM_PROMPT }}
        run: |
          declare -A sites=(
            ["All News"]="https://www.warhammer-community.com/en-gb/all-news-and-features/ all-cache.json all.rss"
            ["Warhammer 40k"]="https://www.warhammer-community.com/en-gb/setting/warhammer-40000/ 40k-cache.json 40k.rss"
            ["Kill Team"]="https://www.warhammer-community.com/en-us/setting/kill-team/ kill-team-cache.json kill-team.rss"
          )

          for name in "${!sites[@]}"; do
            IFS=' ' read -r url cache rss <<< "${sites[$name]}"
            echo "⚙️ Updating RSS for $name..."
            SITE_URL="$url" CACHE_FILE="$cache" RSS_FILE="$rss" OUTPUT_DIR='./docs' \
            npx nx run mechanicus-scrivener:generate-rss
          done

      - name: '🚀 Check for RSS Feed Changes'
        id: check_changes
        run: |
          git add docs/*
          if git diff --staged --quiet; then
            echo "No changes detected."
            echo "changed=false" >> $GITHUB_ENV
          else
            echo "Changes detected."
            echo "changed=true" >> $GITHUB_ENV
          fi

      - name: '📜 Commit and Push Changes'
        if: env.changed == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git commit -m "🤖 Auto-update RSS feed [$(date)]"
          git remote set-url origin https://x-access-token:${GITHUB_TOKEN}@github.com/paulschoen/omniforge.git
          git push origin main
